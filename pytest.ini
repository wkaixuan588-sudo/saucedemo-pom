[pytest]
# 默认有头模式运行 Chromium；如需无头运行（CI）:
#   pytest -o addopts="--browser=chromium --screenshot only-on-failure --video retain-on-failure --tracing retain-on-failure"
addopts = --headed --browser=chromium --output=test-results
    --screenshot only-on-failure
    --video retain-on-failure
    --tracing retain-on-failure
testpaths = tests
markers =
    smoke: 核心主流程冒烟用例（登录成功 + 下单主链路）
    regression: 全量回归用例
