name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 UTC 2:00（北京时间 10:00）巡检，防止 demo 站点变更导致仓库"变红"没人知道
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Run tests (headless, full regression)
        run: pytest -o addopts="--browser=chromium --screenshot only-on-failure --video retain-on-failure --tracing retain-on-failure"

      - name: Upload failure artifacts (screenshot/video/trace)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
